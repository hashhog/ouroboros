name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]" || pip install . pytest pytest-asyncio
      # Functional tests spin up live nodes and need the compiled Rust
      # extension; the unit suite is the CI gate.
      - run: pytest tests/ -v --ignore=tests/functional

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin ruff so a newer release can't surprise-break the gate.
      - run: pip install "ruff==0.16.1"
      # Gate on critical rules only: pycodestyle E9 (syntax errors) and
      # pyflakes F63/F7/F82 (misplaced statements, undefined names).
      # The full pyproject ruleset (E,W,F,I,B,C4,UP) has a legacy backlog
      # (~1170 violations) slated for post-1.0 cleanup; widening this gate
      # as the backlog burns down is follow-up work.
      - run: ruff check --select E9,F63,F7,F82

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ouroboros:${{ github.sha }}
