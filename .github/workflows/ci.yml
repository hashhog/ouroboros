name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust library ──────────────────────────────────────────────────────
  test-rust:
    name: Rust check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsnappy-dev zlib1g-dev libbz2-dev liblz4-dev libzstd-dev \
            libssl-dev pkg-config libclang-dev

      - name: Cargo check (library only)
        run: cargo check --manifest-path ferrous-utils/sync/Cargo.toml --lib

      - name: Cargo test (library only)
        run: cargo test --manifest-path ferrous-utils/sync/Cargo.toml --lib

      - name: Clippy
        run: cargo clippy --manifest-path ferrous-utils/sync/Cargo.toml --lib -- -D warnings
        continue-on-error: true

  # ── Python integration tests (no Rust extension needed) ───────────────
  test-python:
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project deps; rocksdb may fail without system libs — not needed for pure-Python tests
          pip install -e ".[dev]" || pip install pytest pytest-asyncio coincurve base58 bech32 fastapi pydantic rich click uvicorn aiofiles

      - name: Run integration tests
        run: pytest tests/ -v

  # ── Python integration tests WITH Rust extension ──────────────────────
  test-python-with-rust:
    name: Python + Rust integration
    runs-on: ubuntu-latest
    needs: test-rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsnappy-dev zlib1g-dev libbz2-dev liblz4-dev libzstd-dev \
            libssl-dev pkg-config libclang-dev

      - name: Install Python dependencies & build Rust extension
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          pip install -e ".[dev]"
          maturin develop --manifest-path ferrous-utils/sync/Cargo.toml

      - name: Run all tests
        run: |
          pytest tests/ -v
          python -m pytest src/ouroboros/tests/ -v || true

  # ── Linting ───────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ruff
        run: |
          pip install ruff
          ruff check src/ouroboros/ --select E,F,W --ignore E501
        continue-on-error: true
